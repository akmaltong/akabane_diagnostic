name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doctor/**'
      - 'shared/**'
      - 'assets/**'
      - 'crm/**'
      - 'patient/**'
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf cap-web
          mkdir -p cap-web

          # Copy full project structure so all links work
          cp index.html cap-web/index.html
          cp -r assets/ cap-web/assets/
          cp -r shared/ cap-web/shared/
          cp -r doctor/ cap-web/doctor/
          cp -r crm/ cap-web/crm/
          cp -r patient/ cap-web/patient/

          # Download Supabase JS once for offline use
          curl -sL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" \
            -o cap-web/supabase.min.js

          # Fix navigation links: Capacitor WebView doesn't resolve dir/ → dir/index.html
          sed -i 's|href="crm/"|href="crm/index.html"|g' cap-web/index.html
          sed -i 's|href="doctor/"|href="doctor/index.html"|g' cap-web/index.html
          sed -i 's|href="patient/"|href="patient/index.html"|g' cap-web/index.html

          # Replace CDN references with local file in all HTML pages
          # From doctor/ subdir: ../supabase.min.js
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|../supabase.min.js|g' \
            cap-web/doctor/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|../supabase.min.js|g' \
            cap-web/crm/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|../supabase.min.js|g' \
            cap-web/patient/index.html

          # Fix query string on shared script (breaks WebView file loading)
          sed -i 's|\.\./shared/doctor-patient-loader\.js?v=[0-9]*|../shared/doctor-patient-loader.js|g' \
            cap-web/doctor/index.html

          # Disable PWA service worker (not needed in APK)
          sed -i "s|if ('serviceWorker' in navigator)|if (false)|g" cap-web/doctor/index.html

          # Extract heavy inline data from doctor page to separate files (4MB → 400KB)
          python3 << 'PYEOF'
          import os

          with open('cap-web/doctor/index.html', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          # Extract ORGAN_IMAGES block (multi-line, ~2.5MB base64)
          organ_start = None
          organ_end = None
          for i, line in enumerate(lines):
              if line.strip().startswith('const ORGAN_IMAGES'):
                  organ_start = i
              elif organ_start is not None and organ_end is None:
                  if line.strip() == '};':
                      organ_end = i
                      break

          if organ_start is not None and organ_end is not None:
              organ_block = ''.join(lines[organ_start:organ_end+1])
              with open('cap-web/doctor/organ-images.js', 'w', encoding='utf-8') as f:
                  f.write(organ_block)
              lines[organ_start] = 'const ORGAN_IMAGES = {};\n'
              for j in range(organ_start+1, organ_end+1):
                  lines[j] = ''
              print(f'Extracted ORGAN_IMAGES ({organ_end-organ_start} lines)')

          # Extract THERAPY_ATLAS (single 1.5MB line)
          for i, line in enumerate(lines):
              if line.startswith('const THERAPY_ATLAS'):
                  with open('cap-web/doctor/therapy-atlas.js', 'w', encoding='utf-8') as f:
                      f.write(line)
                  lines[i] = 'const THERAPY_ATLAS = {};\n'
                  print(f'Extracted THERAPY_ATLAS (line {i+1})')
                  break

          # Inject external scripts right before the main </head>
          inject = '<script src="organ-images.js"></script>\n<script src="therapy-atlas.js"></script>\n'
          for i, line in enumerate(lines):
              if '</head>' in line:
                  lines[i] = line.replace('</head>', inject + '</head>')
                  break

          with open('cap-web/doctor/index.html', 'w', encoding='utf-8') as f:
              f.writelines(lines)

          size_mb = os.path.getsize('cap-web/doctor/index.html') / 1024 / 1024
          print(f'doctor/index.html: {size_mb:.2f}MB')
          PYEOF

          echo "=== cap-web structure ==="
          find cap-web -name "*.html" -o -name "*.js" | grep -v node_modules | sort
          echo "=== doctor page size ==="
          wc -c cap-web/doctor/index.html

      - name: Init Capacitor
        run: npx cap init Akabane com.akmal.akabane --web-dir cap-web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akabane-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
