name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doctor/**'
      - 'shared/**'
      - 'assets/**'
      - 'capacitor.config.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p cap-web/shared

          # Copy doctor app as root index
          cp doctor/index.html cap-web/index.html

          # Copy shared scripts
          cp shared/doctor-patient-loader.js cap-web/shared/

          # Fix relative path: ../shared/ -> shared/
          sed -i 's|\.\./shared/|shared/|g' cap-web/index.html

          # Download Supabase JS for offline use
          curl -sL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" \
            -o cap-web/supabase.min.js

          # Replace CDN reference with local file
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|supabase.min.js|g' \
            cap-web/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akabane-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
