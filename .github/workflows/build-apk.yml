name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doctor/**'
      - 'shared/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf cap-web
          mkdir -p cap-web/shared

          # Copy doctor app as root page
          cp doctor/index.html cap-web/index.html

          # Copy shared scripts (without ?v=3 query string)
          cp shared/doctor-patient-loader.js cap-web/shared/doctor-patient-loader.js

          # Fix: ../shared/doctor-patient-loader.js?v=3  →  shared/doctor-patient-loader.js
          sed -i 's|\.\./shared/doctor-patient-loader\.js?v=[0-9]*|shared/doctor-patient-loader.js|g' cap-web/index.html
          # Fallback: any remaining ../shared/ references
          sed -i 's|\.\./shared/|shared/|g' cap-web/index.html

          # Download Supabase JS for offline use
          curl -sL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" \
            -o cap-web/supabase.min.js

          # Replace CDN reference with local file (use ./ prefix for clarity)
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|./supabase.min.js|g' \
            cap-web/index.html

          # Remove PWA service worker registration (not needed in APK)
          sed -i "s|if ('serviceWorker' in navigator)|if (false)|g" cap-web/index.html

          # Split heavy data (4MB) into separate files for fast startup
          python3 << 'PYEOF'
          import re, os

          with open('cap-web/index.html', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          # --- 1. Extract ORGAN_IMAGES base64 block (lines starting with 'const ORGAN_IMAGES') ---
          organ_start = None
          organ_end = None
          for i, line in enumerate(lines):
              if line.strip().startswith('const ORGAN_IMAGES'):
                  organ_start = i
              elif organ_start is not None and organ_end is None:
                  if line.strip() == '};':
                      organ_end = i
                      break

          if organ_start is not None and organ_end is not None:
              organ_block = ''.join(lines[organ_start:organ_end+1])
              with open('cap-web/organ-images.js', 'w', encoding='utf-8') as f:
                  f.write(organ_block)
              # Replace block with empty object + comment
              lines[organ_start] = 'const ORGAN_IMAGES = {}; /* loaded from organ-images.js */\n'
              for j in range(organ_start+1, organ_end+1):
                  lines[j] = ''
              print(f'Extracted ORGAN_IMAGES ({organ_end-organ_start+1} lines → organ-images.js)')

          # --- 2. Extract THERAPY_ATLAS single-line (the 1.5MB line) ---
          for i, line in enumerate(lines):
              if line.startswith('const THERAPY_ATLAS'):
                  with open('cap-web/therapy-atlas.js', 'w', encoding='utf-8') as f:
                      f.write(line)
                  lines[i] = 'const THERAPY_ATLAS = {}; /* loaded from therapy-atlas.js */\n'
                  print(f'Extracted THERAPY_ATLAS (line {i+1}, {len(line)//1024}KB → therapy-atlas.js)')
                  break

          # --- 3. Inject external scripts BEFORE closing </head> ---
          inject = '<script src="organ-images.js"></script>\n<script src="therapy-atlas.js"></script>\n'
          for i, line in enumerate(lines):
              if '</head>' in line:
                  lines[i] = line.replace('</head>', inject + '</head>')
                  print('Injected external script tags before </head>')
                  break

          with open('cap-web/index.html', 'w', encoding='utf-8') as f:
              f.writelines(lines)

          size = os.path.getsize('cap-web/index.html')
          print(f'Final cap-web/index.html size: {size//1024}KB')
          PYEOF

          # Verify
          echo "=== Script tags in cap-web/index.html ==="
          grep -n "<script" cap-web/index.html | tail -10
          echo "=== Files in cap-web ==="
          find cap-web -type f | sort

      - name: Init Capacitor
        run: npx cap init Akabane com.akmal.akabane --web-dir cap-web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akabane-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
