name: sync-calendar
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install icalendar recurring-ical-events
      - run: python scripts/sync_calendar.py
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add shared/calendar-events.json
          git diff --cached --quiet || (git commit -m "chore: sync calendar" && git push)
