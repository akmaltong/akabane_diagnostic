# Akabane_diagnostic Workflow Update Diagnostic Classification Logic

## Action

Follow the update-diagnostic-classification-logic workflow:
1. Update classification logic in shared/akabane-rules.js or equivalent shared logic file.
2. Update frontend files (e.g., patient/index.html, doctor/index.html) to match new classification boundaries and display correct badges or labels.
3. Ensure all affected views and exports (e.g., protocol generation, markdown export) use the updated logic.
4. Test by running through diagnostic scenarios in the UI.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: shared/akabane-rules.js, patient/index.html, doctor/index.html

