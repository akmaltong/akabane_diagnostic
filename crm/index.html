<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akabane CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#08091a;--bg2:#0c0d20;--surface:#0f1028;--surface2:#161630;
  --border:#22233c;--border2:#2e2f50;
  --gold:#c9a84c;--gold-d:rgba(201,168,76,.15);
  --violet:#6a5ef5;--violet-d:rgba(106,94,245,.15);--violet-h:#7a6ef8;
  --green:#3db87a;--green-d:rgba(61,184,122,.14);
  --red:#e05151;--red-d:rgba(224,81,81,.13);
  --amber:#e0a045;--amber-d:rgba(224,160,69,.14);
  --text:#e6e6f4;--text2:#9898bc;--text3:#5c5c7e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}

/* SIDEBAR */
.sidebar{width:64px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0 14px;gap:4px;flex-shrink:0}
.sb-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#6050e0);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:16px;flex-shrink:0;text-decoration:none}
.nav-btn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;border:1px solid transparent;transition:background .12s;color:var(--text3);user-select:none}
.nav-btn:hover{background:rgba(255,255,255,.05);color:var(--text2)}
.nav-btn.active{background:var(--violet-d);border-color:rgba(106,94,245,.3);color:#a0a0f8}
.nb-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg2);display:none}
.sb-space{flex:1}

/* LAYOUT */
.layout{flex:1;display:flex;overflow:hidden}
.section{display:none;flex:1;overflow:hidden}
.section.on{display:flex}

/* LIST PANEL */
.list-panel{width:284px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;background:var(--bg2)}
.lp-head{padding:13px 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.lp-title{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--text)}
.lp-count{font-size:12px;color:var(--text3);font-weight:400;margin-left:5px}
.btn-add{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-add:hover{background:var(--violet-h)}
.lp-search{margin:9px 12px 0;position:relative;flex-shrink:0}
.lp-search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:7px 11px 7px 30px;font-size:13px;font-family:'DM Sans',sans-serif}
.lp-search input::placeholder{color:var(--text3)}
.lp-search input:focus{outline:0;border-color:var(--violet)}
.lp-search-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.chips{display:flex;gap:5px;padding:7px 12px;overflow-x:auto;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .12s}
.chip:hover{color:var(--text2)}
.chip.on{background:var(--violet-d);border-color:rgba(106,94,245,.4);color:#a0a0f8}
.pat-list{flex:1;overflow-y:auto}
.pat-list::-webkit-scrollbar{width:3px}
.pat-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.pat-row{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.035);display:flex;gap:10px;align-items:center;cursor:pointer;border-left:2px solid transparent;transition:background .1s}
.pat-row:hover{background:rgba(255,255,255,.025)}
.pat-row.sel{background:rgba(106,94,245,.08);border-left-color:var(--violet)}
.pat-row.overdue:not(.sel){border-left-color:rgba(224,81,81,.4)}
.p-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#241650,#4838b0);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:#bca8ff;flex-shrink:0}
.p-av.gold{background:linear-gradient(135deg,#362008,#7a5018);color:#f0d070}
.p-inf{flex:1;min-width:0}
.p-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{font-size:11px;color:var(--text3);margin-top:1px}
.p-rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sp{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.sp-new{background:rgba(106,94,245,.15);color:#a0a0f8;border:1px solid rgba(106,94,245,.3)}
.sp-diagnostic{background:rgba(180,120,255,.12);color:#c090ff;border:1px solid rgba(140,80,220,.3)}
.sp-course{background:var(--green-d);color:#5dcc90;border:1px solid rgba(61,184,122,.3)}
.sp-paused{background:var(--amber-d);color:#dba050;border:1px solid rgba(224,160,69,.3)}
.sp-completed{background:rgba(61,184,122,.08);color:#4daa70;border:1px solid rgba(61,184,122,.2)}
.sp-followup{background:rgba(61,180,220,.1);color:#4daad0;border:1px solid rgba(61,180,220,.25)}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.list-empty{padding:28px 16px;text-align:center;color:var(--text3);font-size:13px}

/* DETAIL PANEL */
.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:8px}
.detail-empty-ic{font-size:44px;opacity:.2}
.d-head{padding:13px 18px 11px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;flex-shrink:0;background:var(--bg2)}
.d-av{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#241650,#4838b0);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#bca8ff;flex-shrink:0;border:1px solid rgba(106,94,245,.3)}
.d-inf{flex:1;min-width:0}
.d-name{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--text);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--text3)}
.d-meta a{color:var(--text3);text-decoration:none}
.d-meta a:hover{color:var(--text2)}
.d-acts{display:flex;gap:7px;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;border:0;white-space:nowrap;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn-v{background:var(--violet);color:#fff}
.btn-s{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.btn-s:hover{color:var(--text)}
.btn-go{background:var(--green-d);color:var(--green);border:1px solid rgba(61,184,122,.3)}
.btn-au{background:var(--gold-d);color:var(--gold);border:1px solid rgba(201,168,76,.35)}
.btn-rm{background:var(--red-d);color:var(--red);border:1px solid rgba(224,81,81,.3)}
.btn-ic{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);width:36px;height:36px;padding:0;border-radius:9px;font-size:16px}
.btn-ic:hover{color:var(--text)}

/* TABS */
.d-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 14px;flex-shrink:0;overflow-x:auto}
.d-tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;font-size:12px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--text);border-bottom-color:var(--violet)}
.tab-body{flex:1;overflow-y:auto;padding:18px 20px}
.tab-body::-webkit-scrollbar{width:3px}
.tab-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* STATS ROW */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat-v{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-l{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:4px}

/* SEC LABEL */
.sec-l{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:9px}

/* CARD (entries) */
.entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-bottom:8px}
.entry-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.entry-date{font-size:13px;font-weight:600;color:var(--text)}
.entry-sub{font-size:12px;color:var(--text3);margin-top:3px}
.entry-note{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5}
.diag-bgs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.dbg{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700}
.dbg-ex{background:var(--red-d);color:#e08080;border:1px solid rgba(224,81,81,.3)}
.dbg-def{background:var(--violet-d);color:#a0a0f0;border:1px solid rgba(106,94,245,.3)}
.dbg-sev{background:var(--amber-d);color:#dba050;border:1px solid rgba(224,160,69,.3)}
.dbg-ok{background:var(--green-d);color:#5dcc90;border:1px solid rgba(61,184,122,.3)}
.pay-amt{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--gold)}
.promo{background:var(--gold-d);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:13px;color:var(--gold);line-height:1.5}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;min-height:0}
.chat-msgs::-webkit-scrollbar{width:3px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.msg{max-width:78%;border-radius:12px;padding:10px 14px;font-size:13px}
.msg.doctor{align-self:flex-end;background:var(--violet-d);border:1px solid rgba(106,94,245,.25)}
.msg.patient{align-self:flex-start;background:var(--surface2);border:1px solid var(--border2)}
.msg-auth{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--text3);margin-bottom:3px}
.msg-time{font-size:10px;color:var(--text3);margin-top:4px}
.chat-compose{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;margin-top:10px;flex-shrink:0}
.chat-compose textarea{width:100%;background:transparent;border:0;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;resize:none;min-height:54px}
.chat-compose textarea:focus{outline:0}
.chat-compose textarea::placeholder{color:var(--text3)}
.compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* FIELDS */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fg{display:flex;flex-direction:column}
.fg.full{grid-column:1/-1}
.fl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.fi,.fsel,.fta{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif}
.fta{min-height:76px;resize:vertical}
.fi:focus,.fsel:focus,.fta:focus{outline:0;border-color:var(--violet)}
.fi::placeholder,.fta::placeholder{color:var(--text3)}
.card-acts{display:flex;gap:9px;flex-wrap:wrap}

/* ANALYTICS */
.analytics-wrap{flex:1;overflow-y:auto;padding:22px}
.analytics-wrap::-webkit-scrollbar{width:3px}
.analytics-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.a-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.a-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.a-v{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.a-l{font-size:11px;color:var(--text3);margin-top:4px}
.inbox-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;border-left:3px solid var(--gold)}
.inbox-name{font-size:14px;font-weight:600;color:var(--text)}
.inbox-msg{font-size:13px;color:var(--text2);margin-top:3px}
.inbox-time{font-size:11px;color:var(--text3);margin-top:3px}
.file-lnk{display:inline-flex;align-items:center;gap:5px;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:4px 10px;font-size:12px;margin-top:5px}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-bx{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:22px;width:min(540px,96vw);max-height:90vh;overflow-y:auto}
.modal-bx.wide{width:min(700px,96vw)}
.modal-bx::-webkit-scrollbar{width:3px}
.modal-bx::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.modal-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px}
.modal-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.modal-ttl{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--text)}
.modal-cl{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-cl:hover{color:var(--text)}
.modal-ft{display:flex;gap:9px;margin-top:18px}

/* DIAG MODAL */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum-tile{border-radius:10px;padding:10px;text-align:center}
.sum-tile b{display:block;font-size:22px;font-weight:950;font-family:'Rajdhani',sans-serif;line-height:1}
.sum-tile span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.proto-sec{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px;margin:8px 0}
.proto-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.proto-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);gap:8px}
.proto-row:last-child{border-bottom:0}
.proto-org{color:var(--text);font-size:13px}
.proto-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:4px 12px;font-size:12px;font-weight:700;color:#a0a0f0;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.proto-btn:hover{background:var(--violet-d);border-color:rgba(106,94,245,.5);color:#c0c0ff}
.meas-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.meas-tbl th{text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase;padding:5px 7px;border-bottom:1px solid var(--border)}
.meas-tbl td{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text2)}

/* PT MODAL */
.pt-sec{margin-top:12px}
.pt-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.pt-body-txt{font-size:13px;color:var(--text2);line-height:1.65}

/* NOTIFY */
.ntf{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;animation:ntfIn .18s ease;white-space:nowrap;pointer-events:none}
.ntf.ok{background:var(--green-d);border:1px solid rgba(61,184,122,.4);color:#5dcc90}
.ntf.err{background:var(--red-d);border:1px solid rgba(224,81,81,.4);color:#e08080}
@keyframes ntfIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* EMPTY */
.empty-st{padding:22px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:12px;margin:4px 0}

/* OVERVIEW EXTRAS */
.quick-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.notes-blk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;font-size:13px;color:var(--text2);line-height:1.6}

/* MOBILE */
@media(max-width:860px){
  body{flex-direction:row}
  .sidebar{width:56px}
  .list-panel{width:100%;max-width:260px}
  .stat-row{grid-template-columns:1fr 1fr}
  .a-stats{grid-template-columns:1fr 1fr}
  .fields{grid-template-columns:1fr}
  .sum-grid{grid-template-columns:1fr 1fr}
  .d-acts .btn-s{display:none}
}
@media(max-width:620px){
  body{flex-direction:column;overflow:auto}
  .sidebar{width:100%;height:52px;flex-direction:row;padding:0 14px;border-right:0;border-bottom:1px solid var(--border)}
  .sb-logo{margin-bottom:0;margin-right:10px;width:32px;height:32px}
  .sb-space{display:none}
  .layout{flex-direction:column;overflow:visible;flex:none}
  .section.on{flex-direction:column}
  .list-panel{width:100%;max-width:100%;max-height:48vh;border-right:0;border-bottom:1px solid var(--border)}
  .detail-panel{min-height:60vh}
  .analytics-wrap{padding:14px}
}
</style>
</head>
<body>

<nav class="sidebar">
  <a class="sb-logo" href="../" title="На главную">KM</a>
  <div class="nav-btn active" data-nav="patients" onclick="setNav('patients')" title="Пациенты">👥</div>
  <div class="nav-btn" data-nav="analytics" onclick="setNav('analytics')" title="Аналитика">📊</div>
  <div class="nav-btn" data-nav="inbox" onclick="setNav('inbox')" title="Входящие" style="position:relative">
    💬<span class="nb-dot" id="inboxDot"></span>
  </div>
  <div class="sb-space"></div>
  <div class="nav-btn" onclick="load()" title="Обновить">🔄</div>
</nav>

<div class="layout">

  <!-- PATIENTS -->
  <div id="sec-patients" class="section on">
    <div class="list-panel">
      <div class="lp-head">
        <span class="lp-title">Пациенты<span class="lp-count" id="patCount">0</span></span>
        <button class="btn-add" onclick="openNewPat()">+ Добавить</button>
      </div>
      <div class="lp-search">
        <span class="lp-search-ic">🔍</span>
        <input placeholder="Имя или телефон..." oninput="srchQ=this.value;renderList()">
      </div>
      <div class="chips">
        <div class="chip on" data-f="" onclick="setFilter(this)">Все</div>
        <div class="chip" data-f="course" onclick="setFilter(this)">На курсе</div>
        <div class="chip" data-f="new" onclick="setFilter(this)">Новые</div>
        <div class="chip" data-f="diagnostic" onclick="setFilter(this)">Диагностика</div>
        <div class="chip" data-f="paused" onclick="setFilter(this)">Пауза</div>
        <div class="chip" data-f="completed" onclick="setFilter(this)">Завершили</div>
      </div>
      <div class="pat-list" id="patRows"></div>
    </div>
    <div id="detailEl" class="detail-panel">
      <div class="detail-empty"><div class="detail-empty-ic">👤</div><div>Выберите пациента</div></div>
    </div>
  </div>

  <!-- ANALYTICS -->

function e(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ini(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function fdt(v){return v?new Date(v).toLocaleString('ru'):'—'}
function fdts(v){return v?new Date(v).toLocaleDateString('ru',{day:'numeric',month:'short'}):'—'}
function toLocal(v){if(!v)return'';const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fromLocal(v){return v?new Date(v).toISOString():null}
function pHref(p){return String(p||'').replace(/[^\d+]/g,'')}
function wa(phone){let n=String(phone||'').replace(/[^\d]/g,'');if(n.startsWith('8'))n='992'+n.slice(1);return n?'https://wa.me/'+n:''}
function vs(p){if(!p.next_visit)return'';const d=new Date(p.next_visit)-Date.now();if(d<0)return'overdue';if(d<86400000)return'soon';return''}
function gp(id){return pats.find(p=>p.id===id)}
function pn(id){return gp(id)?.full_name||'Без имени'}
function pmsg(id){return msgs.filter(m=>m.patient_id===id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}

function pdiag(id){return diags.filter(d=>d.patient_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function lmsg(id){const a=pmsg(id);return a[a.length-1]||null}

function ntf(msg,type='ok'){
  document.querySelectorAll('.ntf').forEach(n=>n.remove());
  const el=document.createElement('div');
  el.className=`ntf ${type}`;el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function diagCls(t){const n=Number(t);if(!Number.isFinite(n))return null;if(n<=4)return'excess';if(n<=7)return'normal';if(n<=13)return'deficiency';return'severe'}
function parseDiag(json){
  let d;try{d=typeof json==='string'?JSON.parse(json):(json||{})}catch(er){d={}}
  let ex=[],def=[],sev=[];
  if(d.analysis){ex=d.analysis.excess||[];def=d.analysis.deficiency||[];sev=d.analysis.severe||[]}
  const raw=d.results||d.measurements||d.rows||d.points||d.data||[];
  const rows=raw.map((r,i)=>{
    const t=r.reaction_time!=null?r.reaction_time:r.time!=null?r.time:r.value!=null?r.value:null;
    const cls=t!==null?diagCls(t):null;
    const organ=r.organ||r.meridian||r.name||('Точка '+(i+1));
    const side=r.side||r.hand||'';
    return{organ,side,t,cls,label:organ+(side?' ('+side+')':'')};
  });
  if(!ex.length&&!def.length&&!sev.length&&rows.length){
    for(const r of rows){if(!r.cls)continue;if(r.cls==='excess')ex.push(r.label);else if(r.cls==='deficiency')def.push(r.label);else if(r.cls==='severe')sev.push(r.label)}
  }
  return{ex,def,sev,rows,normal:rows.filter(r=>r.cls==='normal').length};
}

async function load(keep=false){
  try{
    const [p,m,s,py,dg]=await Promise.all([
      sb.from('patients').select('*').order('created_at',{ascending:false}),
      sb.from('messages').select('*').order('created_at',{ascending:true}),
      sb.from('therapy_sessions').select('*').order('created_at',{ascending:true}),
      sb.from('payments').select('*').order('created_at',{ascending:false}),
      sb.from('diagnostics').select('id,patient_id,created_at,result_json').order('created_at',{ascending:false}),
    ]);
    if(p.error)throw p.error;
    pats=p.data||[];
    msgs=m.data||[];
    sess=(s.error&&String(s.error.message).includes('does not exist'))?[]:s.data||[];
    pays=(py.error&&String(py.error.message).includes('does not exist'))?[]:py.data||[];
    diags=(dg.error&&String(dg.error.message).includes('does not exist'))?[]:dg.data||[];
    if(!keep&&pats.length&&!selId)selId=pats[0].id;
    render();
  }catch(er){
    console.error(er);
    ntf('Ошибка загрузки: '+er.message,'err');
  }
}

function render(){
  document.title=unrdCnt()?`(${unrdCnt()}) Akabane CRM`:'Akabane CRM';

  document.querySelectorAll('.nav-btn[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));
  document.getElementById(`sec-${nav}`).classList.add('on');
  if(nav==='patients'){renderList();renderDetail();}
  else if(nav==='analytics')renderAnalytics();
  else if(nav==='inbox')renderInbox();
}

function renderList(){
  const q=srchQ.trim().toLowerCase();
  const list=pats.filter(p=>(!q||`${p.full_name||''} ${p.phone||''}`.toLowerCase().includes(q))&&(!filtr||(p.status||'new')===filtr));
  document.getElementById('patCount').textContent=list.length;
  const el=document.getElementById('patRows');
  if(!list.length){el.innerHTML='<div class="list-empty">Пациентов нет</div>';return}
  el.innerHTML=list.map(p=>{
    const u=unrd(p.id),v=vs(p);
    let sub='';
    if(p.next_visit){
      const d=new Date(p.next_visit);
      sub=v==='overdue'?'⚠ Визит просрочен':v==='soon'?'⏰ Сегодня '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    }else sub='Визит не назначен';
    return`<div class="pat-row${selId===p.id?' sel':''}${v==='overdue'?' overdue':''}" onclick="selPat('${p.id}')">
      <div class="p-av">${e(ini(p.full_name))}</div>
      <div class="p-inf">
        <div class="p-name">${e(p.full_name||'Без имени')}</div>
        <div class="p-sub" style="color:${v==='overdue'?'var(--red)':v==='soon'?'var(--amber)':'var(--text3)'}">${e(sub)}</div>
      </div>
      <div class="p-rt">${sp(p.status)}${u?'<div class="unread-dot"></div>':''}</div>
    </div>`;
  }).join('');
}

function renderTab(p){
  if(!p)p=gp(selId);if(!p)return;
  const tc=document.getElementById('tabBody');if(!tc)return;
  const se=pses(p.id),py=ppay(p.id),dg=pdiag(p.id);

  else if(tab==='diagnostics')tc.innerHTML=tabDiag(dg);
  else if(tab==='sessions')tc.innerHTML=tabSess(p,se);
  else if(tab==='payments')tc.innerHTML=tabPay(p,py);
  else if(tab==='chat'){tc.innerHTML=tabChat(p);scrollChat();}
  else if(tab==='card')tc.innerHTML=tabCard(p);
}

function tabOverview(p,se,py,dg){

// ACTIONS
function openDiag(id){

  localStorage.setItem('akabane_active_patient_id',p.id);
  localStorage.setItem('akabane_active_patient_name',p.full_name||'');
  location.href=doctUrl(id);
}
function openCab(id){window.open(patUrl(id),'_blank')}
function cpLink(id){navigator.clipboard?.writeText(location.origin+location.pathname.replace(/crm\/?$/,'')+patUrl(id).replace('../',''));ntf('Ссылка скопирована')}
function dlCard(id){
  const p=gp(id),s=pses(id),py=ppay(id);
  const html=`<html><head><meta charset="utf-8"><style>body{font-family:Arial;padding:30px}.b{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px}</style></head><body><h1>${e(p.full_name)}</h1><p>${e(p.phone||'')}</p><div class="b"><b>Статус:</b> ${SL[p.status||'new']}<br><b>Визит:</b> ${fdt(p.next_visit)}<br><b>Заметки:</b> ${e(p.note||'')}</div><h2>Оплаты</h2>${py.map(x=>`<div class="b">${x.amount} сом · ${fdt(x.payment_date||x.created_at)}<br>${e(x.comment||'')}</div>`).join('')||'Нет'}<h2>Сеансы</h2>${s.map(x=>`<div class="b">Сеанс ${x.session_number} · ${fdt(x.session_date)}<br>${e(x.note||'')}</div>`).join('')||'Нет'}<script>window.print()<\/script></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();
}

async function saveCard(id){
  try{
    const phone=document.getElementById('fc-phone')?.value.trim()||'';
    const status=document.getElementById('fc-status')?.value||'new';
    const next_visit=fromLocal(document.getElementById('fc-visit')?.value);
    const note=document.getElementById('fc-note')?.value.trim()||'';
    const paid_amount=Number(document.getElementById('fc-paid')?.value||0);
    const r=await sb.from('patients').update({phone,status,next_visit,note,paid_amount,paid:paid_amount>0,updated_at:new Date().toISOString()}).eq('id',id);
    if(r.error)throw r.error;
    ntf('Карточка сохранена');await load(true);
  }catch(er){ntf('Ошибка: '+er.message,'err')}
}

async function addPay(id){
  const amount=Number(prompt('Сумма оплаты (сомони):','900')||0);
  if(!amount)return;
  const comment=prompt('Комментарий:','')||'';
  try{
    const r=await sb.from('payments').insert({patient_id:id,amount,method:'manual',comment});
    if(r.error)throw r.error;
    const total=ppay(id).reduce((s,x)=>s+Number(x.amount||0),0)+amount;
    await sb.from('patients').update({paid_amount:total,paid:true,payment_date:new Date().toISOString()}).eq('id',id);
    ntf('Оплата добавлена');await load(true);
  }catch(er){ntf('Ошибка: '+er.message,'err')}
}

async function addSess(id){
  const n=pses(id).length+1;
  const note=prompt(`Заметка к сеансу ${n}:`,'');
  if(note===null)return;
  try{
    const r=await sb.from('therapy_sessions').insert({patient_id:id,session_number:n,session_date:new Date().toISOString(),note});
    if(r.error)throw r.error;
    await sb.from('patients').update({therapy_sessions:n,status:n>=3?'completed':'course'}).eq('id',id);
    ntf(`Сеанс ${n} добавлен`);await load(true);
  }catch(er){ntf('Ошибка: '+er.message,'err')}
}

async function sendRpl(id){
  const text=document.getElementById('replyTxt')?.value.trim()||'';
  const file=document.getElementById('chatFile')?.files[0];
  if(!text&&!file){ntf('Введите текст или файл','err');return}
  try{
    let extra={};
    if(file){
      const safe=file.name.replace(/[^\w.\-]/g,'_');
      const path=`doctor/${Date.now()}_${safe}`;
      const up=await sb.storage.from('chat-files').upload(path,file,{upsert:false});
      if(up.error)throw up.error;
      const pub=sb.storage.from('chat-files').getPublicUrl(path);
      extra={file_url:pub.data.publicUrl,file_name:file.name,file_type:file.type};
    }
    const r=await sb.from('messages').insert({patient_id:id,author:'doctor',message:text,...extra});
    if(r.error)throw r.error;
    ntf('Отправлено');await load(true);
  }catch(er){ntf('Ошибка: '+er.message,'err')}
}

async function clrChat(id){
  if(!confirm('Очистить весь чат?'))return;
  await sb.from('messages').delete().eq('patient_id',id);
  ntf('Чат очищен');await load(true);
}

async function delPat(id){
  if(!confirm(`Удалить "${pn(id)}"? Все данные будут потеряны.`))return;
  try{
    await Promise.all([
      sb.from('payments').delete().eq('patient_id',id),
      sb.from('therapy_sessions').delete().eq('patient_id',id),
      sb.from('messages').delete().eq('patient_id',id),
      sb.from('diagnostics').delete().eq('patient_id',id),
    ]);
    const r=await sb.from('patients').delete().eq('id',id);
    if(r.error)throw r.error;
    if(selId===id)selId=null;
    ntf('Пациент удалён');await load();
  }catch(er){ntf('Ошибка: '+er.message,'err')}
}

function closeMod(id){document.getElementById(id).style.display='none'}

async function createPat(){

function openDiagRes(diagId){
  const dg=diags.find(d=>d.id===diagId);if(!dg)return;
  curDiag=diagId;
  const{ex,def,sev,rows,normal}=parseDiag(dg.result_json);
  const p=gp(dg.patient_id);
  document.getElementById('dm-pat').textContent=p?.full_name||'Пациент';
  document.getElementById('dm-date').textContent=fdt(dg.created_at);
  let html=`<div class="sum-grid">
    <div class="sum-tile" style="background:rgba(224,81,81,.1);border:1px solid rgba(224,81,81,.25)"><b style="color:#e08080">${ex.length}</b><span style="color:#e08080">Избыток</span></div>
    <div class="sum-tile" style="background:rgba(61,184,122,.08);border:1px solid rgba(61,184,122,.2)"><b style="color:#5dcc90">${normal}</b><span style="color:#5dcc90">Норма</span></div>
    <div class="sum-tile" style="background:rgba(106,94,245,.1);border:1px solid rgba(106,94,245,.25)"><b style="color:#a0a0f0">${def.length}</b><span style="color:#a0a0f0">Недостаток</span></div>
    <div class="sum-tile" style="background:rgba(224,160,69,.1);border:1px solid rgba(224,160,69,.25)"><b style="color:#dba050">${sev.length}</b><span style="color:#dba050">Гипернедост.</span></div>
  </div>`;
  if(ex.length){
    html+=`<div class="proto-sec"><div class="proto-ttl" style="color:#e08080">🔻 Седация — Избыток (0–4)</div>`;
    for(const lbl of ex){const org=lbl.split(' (')[0];const pt=(TREATMENT[org]&&TREATMENT[org].sedation)||'?';html+=`<div class="proto-row"><span class="proto-org">${e(lbl)}</span><button class="proto-btn" data-pt="${pt}">${e(pt)}</button></div>`}
    html+='</div>';
  }
  const ton=[...def.map(l=>({l,sv:false})),...sev.map(l=>({l,sv:true}))];
  if(ton.length){
    html+=`<div class="proto-sec"><div class="proto-ttl" style="color:#a0a0f0">🔺 Тонизация — Недостаток${sev.length?' / Гипернедостаток':''}</div>`;
    for(const it of ton){const org=it.l.split(' (')[0];const pt=(TREATMENT[org]&&TREATMENT[org].tonification)||'?';html+=`<div class="proto-row"><span class="proto-org">${it.sv?'<span style="color:var(--amber)">⬇⬇</span> ':''}${e(it.l)}</span><button class="proto-btn" data-pt="${pt}">${e(pt)}</button></div>`}
    html+='</div>';
  }
  if(!ex.length&&!def.length&&!sev.length)html+=`<div class="proto-sec" style="text-align:center;color:var(--green);padding:18px">✅ Все меридианы в норме</div>`;
  if(rows.length){
    html+=`<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--text3);font-size:13px;user-select:none">▶ Все измерения (${rows.length})</summary><table class="meas-tbl"><thead><tr><th>Меридиан</th><th>Сторона</th><th>Значение</th><th>Состояние</th></tr></thead><tbody>`;
    const cm={excess:'#e08080',deficiency:'#a0a0f0',severe:'#dba050',normal:'#5dcc90'};
    const lm={excess:'Избыток',deficiency:'Недостаток',severe:'Гипернедостаток',normal:'Норма'};
    for(const r of rows)html+=`<tr><td>${e(r.organ)}</td><td>${e(r.side)}</td><td>${r.t!==null?Number(r.t).toFixed(1):'—'}</td><td style="color:${cm[r.cls]||'var(--text3)'}">${lm[r.cls]||'—'}</td></tr>`;
    html+='</tbody></table></details>';
  }
  html+=`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-s" onclick="printDiag('${diagId}')">🖨 Печать</button><button class="btn btn-rm" onclick="delDiag('${diagId}')">🗑 Удалить</button></div>`;
  document.getElementById('dm-body').innerHTML=html;
  document.getElementById('diagMod').style.display='flex';
}

async function delDiag(id){
  if(!confirm('Удалить диагностику?'))return;
  const r=await sb.from('diagnostics').delete().eq('id',id);
  if(r.error){ntf('Ошибка: '+r.error.message,'err');return}
  closeMod('diagMod');ntf('Диагностика удалена');await load(true);
}

function printDiag(diagId){
  const dg=diags.find(d=>d.id===diagId);if(!dg)return;
  const{ex,def,sev,rows}=parseDiag(dg.result_json);const p=gp(dg.patient_id);
  const r2h=(arr,type)=>arr.map(lbl=>{const org=lbl.split(' (')[0];const pt=(TREATMENT[org]&&TREATMENT[org][type])||'?';return`<tr><td>${e(lbl)}</td><td style="font-weight:900">${e(pt)}</td></tr>`;}).join('');
  const nm=rows.filter(r=>r.cls==='normal').length;
  const html=`<html><head><meta charset="utf-8"><style>body{font-family:Arial;padding:30px;max-width:700px;margin:auto}h2{margin:18px 0 8px;font-size:14px;border-bottom:1px solid #ddd;padding-bottom:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.tile{border:1px solid #ccc;border-radius:8px;padding:10px;text-align:center}.tile b{display:block;font-size:22px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid #eee;font-size:13px}th{font-size:10px;text-transform:uppercase;color:#888}</style></head><body><h1>Диагностика Акабане</h1><p>${e(p?.full_name||'')} · ${fdt(dg.created_at)}</p><div class="grid"><div class="tile"><b style="color:#c0392b">${ex.length}</b><span>Избыток</span></div><div class="tile"><b style="color:#27ae60">${nm}</b><span>Норма</span></div><div class="tile"><b style="color:#2980b9">${def.length}</b><span>Недостаток</span></div><div class="tile"><b style="color:#e67e22">${sev.length}</b><span>Гипернедост.</span></div></div>${ex.length?`<h2>🔻 Седация</h2><table><thead><tr><th>Меридиан</th><th>Точка</th></tr></thead><tbody>${r2h(ex,'sedation')}</tbody></table>`:''}${def.length||sev.length?`<h2>🔺 Тонизация</h2><table><thead><tr><th>Меридиан</th><th>Точка</th></tr></thead><tbody>${r2h([...def,...sev],'tonification')}</tbody></table>`:''}<script>window.print()<\/script></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();
}

function openPtInfo(pt){
  const d=ATLAS_MINI[pt];
  document.getElementById('pt-title').textContent=d?.title||pt;
  document.getElementById('pt-sub').textContent=pt;
  let html='';
  if(d){
    if(d.location)html+=`<div class="pt-sec"><div class="pt-lbl">Локализация</div><div class="pt-body-txt">${e(d.location)}</div></div>`;
    if(d.functions)html+=`<div class="pt-sec"><div class="pt-lbl">Функции и показания</div><div class="pt-body-txt">${e(d.functions)}</div></div>`;
    if(d.url)html+=`<div style="margin-top:14px"><a href="${d.url}" target="_blank" class="btn btn-au" style="text-decoration:none;display:inline-flex">Полная карточка на eledia.ru →</a></div>`;
  }else{html='<div class="pt-body-txt">Карточка для этой точки не найдена.</div>'}
  document.getElementById('pt-body').innerHTML=html;
  document.getElementById('ptMod').style.display='flex';
}

document.addEventListener('click',function(ev){
  const btn=ev.target.closest('[data-pt]');
  if(btn){openPtInfo(btn.dataset.pt);}
});

function setupRealtime(){
  try{
    sb.channel('crm-v2').on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>load(true)).on('postgres_changes',{event:'*',schema:'public',table:'patients'},()=>load(true)).on('postgres_changes',{event:'*',schema:'public',table:'therapy_sessions'},()=>load(true)).on('postgres_changes',{event:'*',schema:'public',table:'payments'},()=>load(true)).on('postgres_changes',{event:'*',schema:'public',table:'diagnostics'},()=>load(true)).subscribe();
  }catch(er){console.warn(er)}
}

load();setupRealtime();setInterval(()=>load(true),30000);
</script>
